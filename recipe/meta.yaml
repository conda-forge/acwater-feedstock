{% set name = "acwater" %}
{% set version = "0.5.0" %}
{% set python_min = "3.11" %}  # polymer is not 3.10-compatible

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://gitlab.awi.de/phytooptics/acwater/-/archive/v{{ version }}/acwater-v{{ version }}.tar.gz
  sha256: a0a6a93c5a041c9400b189ca1243c87c7a0dec8798781a159e2e3c71b7796525

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - acwater = acwater.cli:main

requirements:
  host:
    - hatchling
    - pip
    - python {{ python_min }}

  run:
    - python >={{ python_min }}
    - enpt
    - polymer
    - netcdf4
    - numpy
    - pandas
    - scipy

test:
  requires:
    - python {{ python_min }}
    - pip
    - pytest
  source_files:
    - tests/test_api.py
  imports:
    - acwater
    - enpt
    - polymer
  commands:
    - pytest tests/test_api.py -v

about:
  home: https://gitlab.awi.de/phytooptics/acwater
  summary: Atmospheric correction of EnMAP hyperspectral data for water surfaces (ACwater), based on EnPT and Polymer.
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - josbel96
    - danschef
